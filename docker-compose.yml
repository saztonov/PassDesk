services:
  # PostgreSQL для локальной разработки
  postgres:
    image: postgres:17-alpine
    container_name: passdesk_postgres
    environment:
      POSTGRES_DB: passdesk
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dbsu10_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d passdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: passdesk_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # pgAdmin для управления БД (опционально)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: passdesk_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  server_sync:
    image: alpine:3.20
    container_name: passdesk_server_sync
    command: >
      sh -c "apk add --no-cache rsync >/dev/null &&
      while true; do
      rsync -a --checksum --delete --exclude node_modules /source/ /target/ || true;
      sleep 3;
      done"
    volumes:
      - ./server:/source:ro,cached
      - server_src:/target
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: passdesk_server
    environment:
      NODE_ENV: development
      PORT: 5000
      API_VERSION: v1
      CLIENT_URL: http://pd.devdenis.ru
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: passdesk
      DB_USER: admin
      DB_PASSWORD: ${DB_PASSWORD:-change_me_local_db_password}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change_me_change_me_change_me_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_change_me_change_me_other_32chars}
      STORAGE_PROVIDER: cloudru
      CLOUDRU_S3_ENDPOINT: https://s3.ru1.storage.beget.cloud
      CLOUDRU_S3_REGION: ru1
      CLOUDRU_S3_ACCESS_KEY_ID: ${CLOUDRU_S3_ACCESS_KEY_ID:-}
      CLOUDRU_S3_SECRET_ACCESS_KEY: ${CLOUDRU_S3_SECRET_ACCESS_KEY:-}
      CLOUDRU_S3_BUCKET_NAME: ${CLOUDRU_S3_BUCKET_NAME:-}
      CLOUDRU_S3_BASE_PATH: ""
      FIELD_ENCRYPTION_ENABLED: true
      APP_FIELD_ENCRYPTION_ACTIVE_KEY_VERSION: v1
      APP_FIELD_ENCRYPTION_KEYS: ${APP_FIELD_ENCRYPTION_KEYS:-}
      APP_FIELD_HASH_PEPPER: ${APP_FIELD_HASH_PEPPER:-}
      # Full encryption mode: keep no plaintext for sensitive string fields.
      FIELD_ENCRYPTION_KEEP_LEGACY_DOC_PLAINTEXT: ${FIELD_ENCRYPTION_KEEP_LEGACY_DOC_PLAINTEXT:-false}
      FIELD_ENCRYPTION_KEEP_LEGACY_PLAINTEXT: ${FIELD_ENCRYPTION_KEEP_LEGACY_PLAINTEXT:-false}
      FILE_ENCRYPTION_ENABLED: true
      FILE_ENCRYPTION_SENSITIVE_DOC_TYPES: passport,kig,patent_front,patent_back,application_scan
      FILE_PROXY_TOKEN_TTL_SECONDS: 300
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-104857600}
      MAX_FILES_PER_REQUEST: ${MAX_FILES_PER_REQUEST:-50}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_PROVIDER: ${OCR_PROVIDER:-openrouter}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_OPENROUTER_ENDPOINT: ${OCR_OPENROUTER_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}
      OCR_MODEL: ${OCR_MODEL:-qwen/qwen3.5-35b-a3b}
      OCR_SCAN_MODELS: ${OCR_SCAN_MODELS:-google/gemini-3.1-flash-lite-preview,qwen/qwen3.5-35b-a3b}
      OCR_OPENROUTER_MODEL: ${OCR_OPENROUTER_MODEL:-}
      OCR_REQUEST_TIMEOUT_MS: ${OCR_REQUEST_TIMEOUT_MS:-60000}
      OCR_PASSPORT_RF_PROMPT: ${OCR_PASSPORT_RF_PROMPT:-}
      OCR_FOREIGN_PASSPORT_PROMPT: ${OCR_FOREIGN_PASSPORT_PROMPT:-}
      OCR_PATENT_PROMPT: ${OCR_PATENT_PROMPT:-}
      OCR_KIG_PROMPT: ${OCR_KIG_PROMPT:-}
      OCR_INN_PROMPT: ${OCR_INN_PROMPT:-}
      OCR_SNILS_PROMPT: ${OCR_SNILS_PROMPT:-}
      OCR_BANK_DETAILS_PROMPT: ${OCR_BANK_DETAILS_PROMPT:-}
      OCR_VISA_PROMPT: ${OCR_VISA_PROMPT:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_LINK_CODE_TTL_MINUTES: ${TELEGRAM_LINK_CODE_TTL_MINUTES:-10}
      TELEGRAM_EXPIRY_CHECK_INTERVAL_MS: ${TELEGRAM_EXPIRY_CHECK_INTERVAL_MS:-3600000}
      MOBILE_ACCESS_CODE_TTL_MINUTES: ${MOBILE_ACCESS_CODE_TTL_MINUTES:-5}
      MOBILE_ACCESS_CODE_MAX_ATTEMPTS: ${MOBILE_ACCESS_CODE_MAX_ATTEMPTS:-5}
      MOBILE_ACCESS_SESSION_TTL_DAYS: ${MOBILE_ACCESS_SESSION_TTL_DAYS:-30}
      MOBILE_ACCESS_SESSION_LIMIT: ${MOBILE_ACCESS_SESSION_LIMIT:-5}
      MOBILE_ACCESS_DELIVERY_MODE: ${MOBILE_ACCESS_DELIVERY_MODE:-log}
      MOBILE_ACCESS_DEBUG_RETURN_CODE: ${MOBILE_ACCESS_DEBUG_RETURN_CODE:-false}
      SKUD_ENABLED: ${SKUD_ENABLED:-false}
      SKUD_PROVIDER: ${SKUD_PROVIDER:-sigur}
      SKUD_SIGUR_BASE_URL: ${SKUD_SIGUR_BASE_URL:-}
      SKUD_SIGUR_USERNAME: ${SKUD_SIGUR_USERNAME:-}
      SKUD_SIGUR_PASSWORD: ${SKUD_SIGUR_PASSWORD:-}
      SKUD_SIGUR_TIMEOUT_MS: ${SKUD_SIGUR_TIMEOUT_MS:-15000}
      SKUD_SIGUR_INSECURE_TLS: ${SKUD_SIGUR_INSECURE_TLS:-false}
      SKUD_SIGUR_DEPARTMENT_ROOT: ${SKUD_SIGUR_DEPARTMENT_ROOT:-}
      SKUD_SIGUR_DEPARTMENT_ROOT_CONTRACTORS: ${SKUD_SIGUR_DEPARTMENT_ROOT_CONTRACTORS:-}
      SKUD_WEBHOOK_BASIC_USER: ${SKUD_WEBHOOK_BASIC_USER:-}
      SKUD_WEBHOOK_BASIC_PASS: ${SKUD_WEBHOOK_BASIC_PASS:-}
      SKUD_WEBHOOK_ALLOWED_IPS: ${SKUD_WEBHOOK_ALLOWED_IPS:-}
      SKUD_QR_HMAC_SECRET: ${SKUD_QR_HMAC_SECRET:-}
      SKUD_QR_PERSISTENT_TTL_SECONDS: ${SKUD_QR_PERSISTENT_TTL_SECONDS:-3600}
      SKUD_QR_ONE_TIME_TTL_SECONDS: ${SKUD_QR_ONE_TIME_TTL_SECONDS:-300}
      SKUD_EVENTS_PULL_INTERVAL_MS: ${SKUD_EVENTS_PULL_INTERVAL_MS:-60000}
      SKUD_EVENTS_PULL_WINDOW_MINUTES: ${SKUD_EVENTS_PULL_WINDOW_MINUTES:-60}
      SKUD_EVENTS_PULL_OVERLAP_MINUTES: ${SKUD_EVENTS_PULL_OVERLAP_MINUTES:-2}
      SKUD_EVENTS_PULL_MAX_PAGES: ${SKUD_EVENTS_PULL_MAX_PAGES:-5}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SKUD_SYNC_CONCURRENCY: ${SKUD_SYNC_CONCURRENCY:-2}
      SKUD_SYNC_RETRY_LIMIT: ${SKUD_SYNC_RETRY_LIMIT:-5}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5003:5000"
    command: >
      sh -c "until [ -f package.json ]; do echo 'Waiting for synced server sources...'; sleep 1; done;
      npm ci;
      npm run db:migrate && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      server_sync:
        condition: service_started
    volumes:
      - server_src:/app
      - server_node_modules:/app/node_modules
    restart: unless-stopped

  client_sync:
    image: alpine:3.20
    container_name: passdesk_client_sync
    command: >
      sh -c "apk add --no-cache rsync >/dev/null &&
      while true; do
      rsync -a --checksum --delete --exclude node_modules --exclude dist /source/ /target/ || true;
      sleep 3;
      done"
    volumes:
      - ./client:/source:ro,cached
      - client_src:/target
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: passdesk_client
    environment:
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_PORT: 5173
      VITE_DEV_HTTPS: "false"
      VITE_ALLOWED_HOSTS: pd.devdenis.ru,localhost,127.0.0.1
      VITE_PROXY_TARGET: http://server:5000
      VITE_USE_POLLING: "false"
      CHOKIDAR_USEPOLLING: "false"
      WATCHPACK_POLLING: "false"
    ports:
      - "5173:5173"
    command: >
      sh -c "until [ -f package.json ]; do echo 'Waiting for synced client sources...'; sleep 1; done;
      npm ci;
      npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - server
      - client_sync
    volumes:
      - client_src:/app
      - client_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
  server_src:
  server_node_modules:
  client_src:
  client_node_modules:
