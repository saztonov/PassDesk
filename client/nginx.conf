# Nginx configuration for PassDesk client (static SPA)
#
# Replaces `vite preview` — production-grade static server with:
#   - gzip compression
#   - aggressive cache for hashed assets
#   - no-cache for index.html (SPA freshness)
#   - security headers (X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy)
#   - /api reverse-proxy to backend
#   - SPA fallback (try_files $uri /index.html)
#
# Listens on 5173 inside the container to keep existing docker-compose
# port mapping ("5173:5173") and upstream Nginx/load-balancer config stable.
# No TLS here — TLS is terminated by upstream reverse proxy (Nginx host-side).

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client body size — reasonable for SPA (file uploads go through /api).
    client_max_body_size 2m;

    # Security headers (applied to ALL responses — static + proxied)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # API reverse proxy to backend container.
    # Upstream server is reachable as "server:5000" via docker-compose network.
    # Preserve Host/client IP for backend's rate limiter and audit logs.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for slow endpoints (Excel import, OCR, ZIP download).
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # File uploads can exceed 2m body limit — relax for /api only.
        client_max_body_size 100m;

        # Disable buffering for streaming endpoints (file download/ZIP).
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Hashed static assets from Vite build — aggressive cache.
    # Vite produces filenames like `index-abc123.js` — safe to cache forever.
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Common static file types — cache 1 day.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # SPA fallback — serve index.html for client-side routes.
    # index.html itself must not be cached (freshness after deploy).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Internal healthcheck for docker-compose (no external exposure).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
